<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>安巡 Agent · 研判台</title>
<style>
:root{
  --paper:#F7F6F2; --card:#FFFFFF; --line:#E6E4DD; --line-2:#D9D6CC;
  --ink:#1A1A1A; --sub:#6B6A66; --faint:#9A9892;
  --red:#A32D2D; --red-soft:#F3E4E2;
  --orange:#B2691A; --orange-soft:#F7EBDC;
  --blue:#185FA5; --blue-soft:#E2ECF6;
  --green:#2F6B4F; --green-soft:#E1EDE6;
  --gold:#8A6A1F;
  --shadow:0 1px 2px rgba(26,26,26,.04),0 8px 24px -12px rgba(26,26,26,.18);
  --shadow-lg:0 2px 6px rgba(26,26,26,.06),0 24px 60px -24px rgba(26,26,26,.35);
  --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);overflow:hidden;
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
body.static *,body.static *:before,body.static *:after{animation:none!important;transition:none!important}
::selection{background:#F0DCD8}
.scroll::-webkit-scrollbar{width:8px;height:8px}
.scroll::-webkit-scrollbar-thumb{background:#DAD7CE;border-radius:8px}
.scroll::-webkit-scrollbar-thumb:hover{background:#C7C3B7}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
.top{
  position:relative;z-index:20;display:flex;align-items:center;gap:18px;
  height:60px;padding:0 18px;background:rgba(255,255,255,.92);
  border-bottom:1px solid var(--line);backdrop-filter:saturate(180%) blur(12px);
}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(163,45,45,.35),rgba(24,95,165,.35),transparent)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:9px;flex:none;position:relative;
  background:linear-gradient(145deg,#22211F,#3A3833);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.mark:before,.mark:after{content:"";position:absolute;background:#F7F6F2;border-radius:2px}
.mark:before{left:8px;top:8px;width:6px;height:14px}
.mark:after{left:16px;top:8px;width:6px;height:6px;opacity:.55}
.brand b{font-size:15px;letter-spacing:.2px;white-space:nowrap}
.brand i{font-style:normal;font-size:11px;color:var(--faint);border:1px solid var(--line-2);
  border-radius:5px;padding:1px 5px;margin-left:2px;vertical-align:1px}


.spacer{flex:1}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);
  border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 9px;background:#fff;transition:.2s}
.status:hover{border-color:var(--line-2)}
.online-link{font-size:12px;color:var(--sub);text-decoration:none;white-space:nowrap;
  border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:#fff;transition:.16s}
.online-link:hover{color:var(--ink);border-color:var(--line-2)}
.online-link[hidden]{display:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.status.live .dot{background:var(--green);box-shadow:0 0 0 3px rgba(47,107,79,.14);animation:breathe 2.4s infinite}
.status.demo .dot{background:var(--gold);box-shadow:0 0 0 3px rgba(138,106,31,.12)}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--sub);transition:.16s}
.iconbtn:hover{background:#EFEDE6;color:var(--ink)}

/* ---------- 三栏 ---------- */
.shell{display:flex;height:calc(100% - 60px);min-height:0;width:100%;overflow:hidden}

/* 左栏 */
aside{width:248px;flex:none;border-right:1px solid var(--line);background:#F2F0EA;
  display:flex;flex-direction:column;min-height:0}
.newbtn{margin:14px 14px 10px;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px;border-radius:11px;background:#22211F;color:#F7F6F2;font-size:13px;
  box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 6px 16px -10px rgba(0,0,0,.6);transition:.18s}
.newbtn:hover{transform:translateY(-1px);box-shadow:0 10px 22px -12px rgba(0,0,0,.7)}
.side-label{padding:4px 20px 6px;font-size:11px;color:var(--faint);letter-spacing:.4px}
.clist{flex:1;overflow:auto;padding:2px 10px 12px}
.citem{position:relative;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;
  font-size:12.5px;color:#3A3A36;cursor:pointer;transition:.14s}
.citem:hover{background:#E9E6DE}
.citem.on{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.citem .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem .x{opacity:0;color:var(--faint);font-size:15px;line-height:1;padding:0 2px;border-radius:4px}
.citem:hover .x{opacity:1}
.citem .x:hover{background:#E2DFD6;color:var(--red)}
.side-foot{margin-top:auto;padding:12px 16px 14px;border-top:1px solid var(--line);
  font-size:11px;color:var(--faint);line-height:1.8}
.side-foot b{color:var(--sub);font-weight:600}

/* 中栏 */
main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper);width:100%}
.stream{flex:1;overflow:auto;padding:26px 0 8px}
.wrap{max-width:760px;margin:0 auto;padding:0 26px}

.empty{padding:34px 0 10px}
.empty h1{margin:0 0 8px;font-size:26px;letter-spacing:-.2px}
.empty h1 span{color:var(--red)}
.empty p{margin:0 0 22px;color:var(--sub);font-size:13.5px;max-width:560px}
.sugg{display:grid;gap:8px}
.sugg button{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;
  background:#fff;border:1px solid var(--line);border-radius:12px;font-size:13px;color:#3A3A36;
  transition:.16s;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.sugg button:hover{border-color:var(--line-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.sugg .n{width:20px;height:20px;border-radius:6px;background:#EFEDE6;color:var(--sub);
  font-size:11px;display:grid;place-items:center;flex:none}
.sugg .go{margin-left:auto;color:var(--faint);font-size:15px}

.msg{display:flex;gap:12px;padding:11px 0}
.msg.enter{animation:fade .28s ease}
.msg .av{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-size:12px;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
.msg.ai .av{background:linear-gradient(145deg,#2B2A27,#43413B);color:#F7F6F2}
.msg.me{flex-direction:row-reverse}
.msg.me .av{background:#E5E2D9;color:#5A5852}
.body{min-width:0;max-width:calc(100% - 44px)}
.msg.me .body{display:flex;flex-direction:column;align-items:flex-end}
.name{font-size:11px;color:var(--faint);margin:2px 0 4px}
.bubble{padding:11px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);
  box-shadow:0 1px 1px rgba(0,0,0,.02);font-size:13.8px;line-height:1.78;overflow-wrap:anywhere}
.msg.me .bubble{background:#22211F;color:#F5F4F0;border-color:#22211F}
.bubble>:first-child{margin-top:0}
.bubble>:last-child{margin-bottom:0}
.bubble h3{font-size:14px;margin:14px 0 6px}
.bubble p{margin:8px 0}
.bubble ul,.bubble ol{margin:8px 0;padding-left:20px}
.bubble li{margin:3px 0}
.bubble code{background:#F1EFE9;border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:12.4px}
.bubble pre{background:#FBFAF7;border:1px solid var(--line);border-radius:10px;padding:11px 12px;overflow:auto;margin:10px 0}
.bubble pre code{background:none;border:0;padding:0;font-size:12.2px}
.bubble blockquote{margin:10px 0;padding:6px 0 6px 12px;border-left:2px solid var(--line-2);color:var(--sub)}
.bubble table{border-collapse:collapse;margin:10px 0;font-size:12.8px;width:100%}
.bubble th,.bubble td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.bubble th{background:#FAF9F6;font-weight:600}
.bubble strong{font-weight:650}
.bubble a{color:var(--blue)}
.acts{display:flex;gap:2px;margin-top:5px;opacity:0;transition:.15s}
.trace{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 7px}
.tchip{font-size:10.5px;color:#4A4843;background:#F4F2EC;border:1px solid var(--line);
  border-radius:7px;padding:2px 7px;line-height:1.5}
.tchip b{font-weight:600;color:var(--blue)}
.tchip.demochip{color:#8A6A1F;background:#FBF3E2;border-color:#EFDDBB}
.tchip.demochip b{color:#8A6A1F}
.msg:hover .acts{opacity:1}
.acts button{font-size:11.5px;color:var(--faint);padding:3px 7px;border-radius:6px}
.acts button:hover{background:#EFEDE6;color:var(--sub)}
.shot{display:block;max-width:min(100%,420px);max-height:220px;width:auto;border-radius:9px;
  margin:0 0 9px;border:1px solid var(--line);background:#fff}
.pending{color:var(--sub);font-size:13px;line-height:1.6;display:flex;align-items:center;gap:8px}.pending:before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--red);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.caret{display:inline-block;width:7px;height:15px;background:var(--red);vertical-align:-2px;
  margin-left:2px;border-radius:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.jump{position:absolute;right:26px;bottom:124px;background:#22211F;color:#fff;
  font-size:12px;padding:7px 13px;border-radius:999px;box-shadow:var(--shadow-lg);display:none;z-index:6}
.jump.on{display:block;animation:fade .2s}

/* 消息内嵌卡片（精简版） */
.chatcard{background:#FBFAF6;margin:12px 0 4px;box-shadow:none}
.crow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.cline{display:flex;align-items:baseline;gap:9px;font-size:12px;color:var(--sub);margin:2px 0 9px}
.cline .n{font-size:27px;line-height:1;font-weight:750;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.cline .n.bad{color:var(--red)}.cline .n.warn{color:var(--orange)}
.cline .n.info{color:var(--blue)}.cline .n.ok{color:var(--green)}.cline .n.gold{color:var(--gold)}

/* 输入区 */
.composer{padding:10px 26px 20px;background:linear-gradient(180deg,rgba(247,246,242,0),var(--paper) 32%)}
.cbox{max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line-2);border-radius:16px;
  box-shadow:var(--shadow);transition:.18s;position:relative}
.cbox:focus-within{border-color:#C9C4B4;box-shadow:0 1px 2px rgba(0,0,0,.04),0 16px 40px -22px rgba(0,0,0,.35)}
.cbox textarea{display:block;width:100%;border:0;outline:0;resize:none;background:none;
  padding:14px 16px 6px;font:inherit;font-size:13.8px;line-height:1.6;max-height:180px;min-height:26px;color:var(--ink)}
.cbox textarea::placeholder{color:#B3B0A8}
.cbar{display:flex;align-items:center;gap:8px;padding:6px 10px 10px 14px}
.chip{font-size:11.5px;color:var(--sub);border:1px solid var(--line);border-radius:999px;
  padding:4px 9px;background:#FCFBF8;transition:.15s}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.send{margin-left:auto;width:34px;height:34px;border-radius:10px;background:#22211F;color:#fff;
  display:grid;place-items:center;transition:.16s}
.send:disabled{opacity:.35;cursor:not-allowed}
.send:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 8px 18px -10px rgba(0,0,0,.8)}
.stop{display:none;margin-left:auto;align-items:center;gap:6px;font-size:12px;color:var(--sub);
  border:1px solid var(--line-2);border-radius:10px;padding:7px 11px;background:#fff}
.stop.on{display:flex}
.tip{max-width:760px;margin:8px auto 0;font-size:11px;color:var(--faint);text-align:center}

/* 右栏 */
section.panel{width:352px;flex:none;border-left:1px solid var(--line);background:#FBFaf7;
  display:flex;flex-direction:column;min-height:0}
.ptop{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.ptop b{font-size:13px}
.ptop .live{font-size:10.5px;color:var(--green);display:flex;align-items:center;gap:5px}
.pbody{flex:1;overflow:auto;padding:0 14px 18px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;
  margin-bottom:10px;box-shadow:0 1px 1px rgba(0,0,0,.02);position:relative;overflow:hidden}
.pcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line-2)}
.pcard.warn:before{background:var(--orange)}
.pcard.bad:before{background:var(--red)}
.pcard.ok:before{background:var(--green)}
.pcard.info:before{background:var(--blue)}
.pcard.gold:before{background:var(--gold)}
.eng{display:inline-flex;align-items:center;font-size:9.5px;color:var(--green);background:var(--green-soft);
  border-radius:999px;padding:1px 6px;margin-left:6px;letter-spacing:0}
.ph{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);letter-spacing:.4px;margin-bottom:10px}
.ph .r{margin-left:auto;font-size:10px;letter-spacing:0}

.vrow{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-top:1px dashed #F0EEE7;font-size:12.3px}
.vrow:first-of-type{border-top:0}
.vrow .p{width:22px;color:var(--faint);font-size:11px;padding-top:2px;flex:none}
.vrow .s{display:flex;align-items:center;gap:6px;flex:none;min-width:64px;font-weight:600;font-size:12px}
.pill{font-size:10.5px;padding:1.5px 7px;border-radius:999px;border:1px solid transparent;font-weight:500}
.t-ok{color:var(--green);background:var(--green-soft)}
.t-warn{color:var(--orange);background:var(--orange-soft)}
.t-bad{color:var(--red);background:var(--red-soft)}
.t-mute{color:var(--sub);background:#F1EFE9}
.vrow .n{color:var(--faint);font-size:11px;line-height:1.55;flex:1}

.risk{display:flex;align-items:flex-end;gap:12px}
.risk .R{font-size:40px;line-height:.95;font-weight:750;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.risk.warn .R{color:var(--orange)}
.risk.bad .R{color:var(--red)}
.risk.info .R{color:var(--blue)}
.risk .f{font-size:11px;color:var(--sub);padding-bottom:4px;line-height:1.5}
.risk .f b{display:block;color:var(--ink);font-size:11.5px}
.meter{height:5px;border-radius:99px;background:#F0EEE7;margin:11px 0 9px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.meter.warn i{background:linear-gradient(90deg,#E0A24D,#B2691A)}
.meter.gold i{background:linear-gradient(90deg,#D8B451,#8A6A1F)}
.meter.bad i{background:linear-gradient(90deg,#D2706A,#A32D2D)}
.meter.info i{background:linear-gradient(90deg,#7FA9D4,#185FA5)}
.kv b.fill{color:var(--faint);font-weight:500;letter-spacing:.4px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:5px 0;border-top:1px dashed #F0EEE7}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--faint);white-space:nowrap;flex:none}
.kv b{font-weight:600;text-align:right}
.tno{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;color:var(--sub)}
.checks{list-style:none;margin:8px 0 0;padding:0;font-size:12px}
.checks li{display:flex;gap:7px;padding:3px 0;color:#3A3A36}
.checks li:before{content:"✓";color:var(--green);font-size:11px;line-height:1.6}
.law{font-size:12px;line-height:1.72;color:#3A3A36}
.law q{display:block;margin-top:6px;color:var(--sub);font-style:normal;border-left:2px solid var(--line-2);padding-left:9px}
.pfoot{font-size:10.5px;color:var(--faint);line-height:1.7;padding:10px 4px 0;border-top:1px solid var(--line);margin-top:4px}

/* 浮动（移动端） */
.fab{display:none;position:fixed;right:14px;bottom:152px;z-index:30;width:44px;height:44px;border-radius:13px;
  background:#22211F;color:#fff;box-shadow:var(--shadow-lg);place-items:center;font-size:16px}
.mask{display:none;position:fixed;inset:0;background:rgba(26,26,26,.32);z-index:28}
.mask.on{display:block}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:#22211F;color:#F5F4F0;
  font-size:12.5px;padding:9px 15px;border-radius:10px;box-shadow:var(--shadow-lg);opacity:0;
  pointer-events:none;transition:.24s;z-index:50;max-width:80vw}
.toast.on{opacity:1;transform:translate(-50%,0)}



/* 响应式 */
@media (max-width:1180px){
  section.panel{position:fixed;right:0;top:60px;bottom:0;z-index:29;width:340px;
    transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
  section.panel.on{transform:none}
  .fab{display:grid}
}
@media (max-width:820px){
  .top{padding:0 10px;gap:8px}
  .brand b{font-size:13px}
  .brand i,.scenes .txt{display:none}
  #btnMenu{display:grid !important;flex:none}
  .status{padding:4px 8px;font-size:11px;flex:none}
  .scenes{margin-left:0;padding:2px;gap:2px}
  .scenes button{padding:5px 8px}
  aside{position:fixed;left:0;top:60px;bottom:0;z-index:29;transform:translateX(-102%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
  aside.on{transform:none}
  .wrap{padding-left:16px;padding-right:16px}
  .composer{padding:8px 16px 16px}
  .risk .R{font-size:34px}
}
@media (max-width:560px){
  #statusText{display:none}
  .brand b{font-size:12.5px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="mark"></div>
    <b>安巡 Agent</b><i>研判台 v3.1</i>
  </div>

  <div class="spacer"></div>
  <!-- 只在本地跑的时候出现：评委问「线上能看吗」时点一下就走。
       线上站点自己是「在线」，再放这个链接没有意义，boot 里会隐藏。 -->
  <a class="online-link" id="onlineLink" href="https://anxun-desk.app.workbuddy.host/?sharecode=OLOGYZUPHO"
     target="_blank" rel="noopener" hidden
     title="在线研判台：同一套页面 + best.onnx 实跑，打开就能聊">在线研判台 ↗</a>
  <div class="status demo" id="status" title="点击切换对话后端">
    <span class="dot"></span><span id="statusText">正在连接云端…</span>
  </div>
  <button class="iconbtn" id="btnMenu" title="会话列表" style="display:none">≡</button>
</header>

<div class="shell">
  <aside id="aside">
    <button class="newbtn" id="btnNew"><span style="font-size:16px;line-height:1">＋</span> 新建对话</button>
    <div class="side-label">最近对话</div>
    <div class="clist scroll" id="clist"></div>
    <div class="side-foot">
      <b>Enter</b> 发送 · <b>Shift+Enter</b> 换行<br>
      判定口径 conf <b id="footConf">0.65</b> / 复核 <b id="footReview">0.20</b>
    </div>
  </aside>

  <main id="main" style="position:relative">
    <div class="stream scroll" id="stream"><div class="wrap" id="flow"></div></div>
    <button class="jump" id="jump">回到底部 ↓</button>

    <div class="composer">
      <div class="cbox">
        <textarea id="input" rows="1" placeholder="问点什么：这处违规什么等级？为什么不是橙色？工单怎么开？"></textarea>
        <div class="cbar">
          <button class="chip" data-ask="risk">判风险等级</button>
          <button class="chip" data-ask="ticket">生成整改工单</button>
          <button class="chip" data-ask="law">查法规原文</button>
          <button class="chip" id="btnUpload" hidden>上传图片实测</button>
          <button class="stop" id="btnStop">■ 停止</button>
          <button class="send" id="btnSend" title="发送">↑</button>
        </div>
      </div>
      <div class="tip" id="tip">内容由模型生成，判定与工单以规则引擎输出为准 · 场景数据为示例（人工构造），非现场运行记录</div>
    </div>

/* ---------------- L / S 的来源：写在代码里，不写在 prompt 里 ---------------- */
var L_RULES = [
  { max:1,        L:1, note:'0–1 次 → L1' },
  { max:3,        L:2, note:'2–3 次 → L2' },
  { max:6,        L:3, note:'4–6 次 → L3' },
  { max:Infinity, L:4, note:'≥7 次 → L4' }
];
var S_RULES = {
  '普通作业':   { S:3, note:'普通作业 → S3' },
  '车辆作业':   { S:3, note:'车辆作业 → S3' },
  '高处作业':   { S:4, note:'高处作业 → S4' },
  '动火作业':   { S:4, note:'动火作业 → S4' },
  '受限空间':   { S:4, note:'受限空间 → S4' }
};

function L_from_count(n, scale){
  n = Number(n) || 0;
  var base = L_RULES[L_RULES.length-1];
  for(var i=0;i<L_RULES.length;i++){ if(n <= L_RULES[i].max){ base = L_RULES[i]; break; } }

  // v1.1：本次单次违规人数也参与 L 取值（docs/安巡风险分级标准.md §2.1.1）。
  // 只看历史台账会把「刚装系统」的区域判得过轻：台账 1 次（L1）但一次抓到 10 人。
  var sc = Number(scale) || 0;
  if(sc <= 0 || sc <= n) return base;
  var top = L_RULES[L_RULES.length-1];
  for(var j=0;j<L_RULES.length;j++){ if(sc <= L_RULES[j].max){ top = L_RULES[j]; break; } }
  if(top.L <= base.L) return base;
  return { L:top.L, note:top.note, baseL:base.L, scaleN:sc };
}
function S_from_work(type){
  return S_RULES[type] || { S:2, note:'未登记的作业类型，按较低严重性处理' };
}

/* 场景的 L/S/R 全部由事实推导：SCENES 里只存事实（违规次数、作业类型） */
function sceneRisk(id){
  var s = SCENES[id];
  if(!s) return null;
  var lr = L_from_count(s.count.n, s.count.scale);
  var sr = S_from_work(s.work.type);
  var g = grade(lr.L, sr.S);
  return {
    L: g.L, S: g.S, R: g.R, level: g.level, deadline: g.deadline, tone: g.tone,
    Lwhy: s.count.why + (lr.scaleN
      ? '（历史档 L' + lr.baseL + '；本次 ' + lr.scaleN + ' 人同发 → L' + lr.L + '，取高者）'
      : '（' + lr.note + '）'),
    Swhy: s.work.why + '（' + sr.note + '）'
  };
}

/* ---------------- 真模型：POST /api/inspect ----------------
   同源起 serve.py 时，右侧面板改成 best.pt 实测：
   现场照片 -> 检测 -> 四态 -> 定级 -> 工单，全部来自模型链路。
   服务没起（比如 GitHub Pages 静态托管）就保持手写示例，页面不报错。 */
var MODEL = {
  ready: false,
  info: null,
  map: { A:'R-02', B:'R-01', C:'R-03' },
  cache: {},
  busy: {}
};

function toneOfState(st){
  if(st === '已佩戴') return 'ok';
  if(st === '待复核') return 'warn';
  if(st === '未佩戴') return 'bad';
  return 'mute';
}

function reasonOf(items, worst){
  var all = items || [];
  var picked = all.filter(function(it){ return it.status === worst; });
  if(!picked.length) picked = all;
  return picked.map(function(it){
    return (it.equip ? it.equip + '：' : '') + (it.reason || '');
  }).join('；').slice(0, 90);
}

function toneOfLevel(lv){
  if(lv === '红色') return 'bad';
  if(lv === '橙色') return 'warn';
  if(lv === '黄色') return 'gold';
  return 'info';
}

/* 把 /api/inspect 的返回摊成页面认得的场景结构（不改 SCENES） */
function sceneFromApi(d){
  var persons = d.persons || [];
  var n = (d.region && d.region.violation_30d) || 0;
  // 本次违规人数：服务端已按「未佩戴」计数，同时参与 L（见 /docs/安巡风险分级标准.md §2.1.1）
  var violN = persons.filter(function(p){ return p.worst === '未佩戴'; }).length;
  // 区域的 scene 有时登记的是场所属性（如「消防通道」），不是作业类型。
  // 这时按 risk_class 兜底，否则页面会落 S=2，而接口按 risk_class 算 3，两边又对不上。
  var WORK_TYPES = ['普通', '车辆', '高处', '动火', '受限空间'];
  var work = (d.region && d.region.scene) || '普通';
  if(WORK_TYPES.indexOf(work) < 0){
    var rc = (d.region && d.region.risk_class) || '';
    work = WORK_TYPES.indexOf(rc) >= 0 ? rc : work;
  }
  // 一个场景可能开出两张单（安全帽 / 背心），各自的人数不同、等级也不同。
  // 原来取 tickets[0]，R-03 会显示成黄色（helmet 3 人），而本次最重的是橙色。
  // 右栏只摆一张卡，就摆最重的那张。
  var t = (d.tickets || []).slice().sort(function(a, b){
    return (b.risk || 0) - (a.risk || 0);
  })[0] || null;
  var out = {
    verdicts: persons.map(function(p, i){
      return { p:'P' + (i + 1), state:p.worst || '-', tone:toneOfState(p.worst), note:reasonOf(p.items, p.worst) };
    }),
    count: { n:n, scale:violN, why:'近 30 天同类违规 ' + n + ' 次' },
    work: { type:work + '作业', why:work + '作业 · 按作业类型取 S' },
    ticket: null, checks: [], law: [],
    _model: true,
    _clean: !(d.events && d.events.length),
    _meta: {
      scene: d.scene && d.scene.scene_id,
      persons: persons.length,
      ms: d.detector && d.detector.mean_ms,
      backend: d.detector && d.detector.name,
      thresholds: d.thresholds || null,
      region: d.region && d.region.region_id,
      source: d.source
    }
  };
  if(t){
    out.ticket = {
      no: t.ticket_id,
      // 责任人留空：这张单要打印出来给现场签字，名字由使用方自己填。
      // 服务端给的 assignee 是「区域负责人姓名」，直接印上去等于替某个人认了这条违规。
      owner: '',
      reviewer: '',       // 复查由现场安排，系统不预填、也不预排时间
      action: cleanReq(t.requirement || ''),
      grade: t.grade || '',
      // 违规类型写进上下文：之前模型按「安全帽」查法规，
      // 实际检出的是反光背心，引用 GB 2811 就跑偏了。
      violation: t.violation || '',
      equip: t.equip || '',
      risk: t.risk,
      L: t.L, S: t.S,
      due_at: t.due_at || '',
      review_at: t.review_at || ''
    };
    // 验收项留空：以前这里塞「时限 / 复查」两条，前端还打 ✓，
    // 读起来像是已经做完了——其实都是将来才发生的事。
    out.checks = [];
    out.law = (t.legal || []).map(function(l){
      return { code:[l.doc, l.clause].filter(Boolean).join(' '), text:l.point || '' };
    });
  }
  return out;
}

function applyModelScene(k, d){
  var s = SCENES[k];
  if(!s || !d || !d.region) return;
  var x = sceneFromApi(d);
  for(var key in x) s[key] = x[key];
  applyThresholds(d.thresholds);

  // 页脚措辞跟着数据来源走：跑过模型就别再写「场景数据为示例」，那等于自打脸
  var tip = document.getElementById('tip');
  if(tip) tip.textContent = '内容由模型生成，判定与工单以规则引擎输出为准 · 右侧为 '
    + modelName() + ' 对样例图的实测结果；'
    + '样例图为公开数据集素材（CC BY 4.0），非同厂现场记录';

  var st = {};
  x.verdicts.forEach(function(v){ st[v.state] = (st[v.state] || 0) + 1; });
  SCENE_CTX[k] = '当前区域不写具体地名；作业类型「' + x.work.type + '」。'
    + x.verdicts.length + ' 名人员：'
    + Object.keys(st).map(function(y){ return y + ' ' + st[y] + ' 人'; }).join('、')
    + (s.ticket && s.ticket.violation
        ? '。本次确认的违规类型：' + s.ticket.violation
          + (s.ticket.equip === 'vest' ? '（反光背心）' : s.ticket.equip === 'helmet' ? '（安全帽）' : '')
          + '——查法规、写整改要求都用这一项，不要换成别的装备。'
        : '')
    + '。近 30 天同类违规 ' + x.count.n + ' 次'
    + '；本次一次抓到 ' + (x.count.scale || 0) + ' 人未佩戴，L 取「历史次数」与「本次人数」的高者'
    + '（《安巡风险分级标准 v1.1》§2.1.1）。'
    + (s.ticket && /^TK-/.test(String(s.ticket.no || ''))
        ? '规则引擎已按实测开出工单 ' + s.ticket.no
          + '（' + (s.ticket.grade || '') + '' + (s.ticket.risk ? ' · R=' + s.ticket.risk : '') + '），'
          + '工单号已开好，用户问工单就直接引用这个号，不要另编。'
        : '')
    + '以上为 ' + modelName() + ' 实测结果，不是手写数据。';
}

/* ---------------- 上传图片跑真模型 ---------------- */
var REGION_OF_SCENE = { A:'A-03', B:'B-01', C:'C-02' };

function pickImage(){
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = function(){
    if(inp.files && inp.files[0]) uploadInspect(inp.files[0]);
  };
  inp.click();
}

/* 上传图压成缩略图再进消息：原图 base64 几百 KB，直接塞 localStorage 几次就满。
   用 createImageBitmap 而不是 Image()+onload：后者在某些环境（无头、部分移动端）
   不触发 load 事件，会把整条上传链路挂住。再加 4 秒兜底，缩略图失败不影响判定。 */
function makeThumb(file, maxW){
  return new Promise(function(resolve){
    var done = false;
    function finish(v){ if(!done){ done = true; resolve(v || ''); } }
    setTimeout(function(){ finish(''); }, 4000);
    function draw(bmp){
      try{
        var scale = Math.min(1, (maxW || 380) / (bmp.width || 1));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(bmp.width * scale));
        c.height = Math.max(1, Math.round(bmp.height * scale));
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        finish(c.toDataURL('image/jpeg', 0.7));
      }catch(e){ finish(''); }
    }
    try{
      if(window.createImageBitmap){
        createImageBitmap(file).then(function(bmp){
          draw(bmp);
          if(bmp.close) bmp.close();
        }).catch(function(){ finish(''); });
      }else{
        var url = URL.createObjectURL(file), img = new Image();
        img.onload = function(){ draw(img); URL.revokeObjectURL(url); };
        img.onerror = function(){ finish(''); URL.revokeObjectURL(url); };
        img.src = url;
      }
    }catch(e){ finish(''); }
  });
}

function readAsDataURL(file){
  return new Promise(function(resolve, reject){
    var fr = new FileReader();
    fr.onload = function(){ resolve(String(fr.result || '')); };
    fr.onerror = function(){ reject(new Error('读不了这个文件')); };
    fr.readAsDataURL(file);
  });
}

async function uploadInspect(file){
  if(!MODEL.ready){ toast('模型服务没起来：先运行 python serve.py'); return; }
  var regionId = REGION_OF_SCENE[S.scene] || 'A-03';
  try{
    toast('正在跑 ' + modelName() + '…');
    // 先把这张图摆进对话，用户才知道系统看的是哪张。
    // 缩略图偶尔会失败（无头浏览器、异常编码），失败就用原图 dataURL 顶上，
    // 上限 700 KB —— 再大就不进消息，免得把 localStorage 撑爆。
    var thumb = await makeThumb(file, 380);
    if(!thumb){
      try{
        var raw = await readAsDataURL(file);
        if(raw && raw.length < 700000) thumb = raw;
      }catch(e){}
    }
    addMsg('user', '上传图片实测：' + (file.name || '未命名'), thumb);
    renderConvo(); enterLast(); toBottom(true);
    var dataUrl = await readAsDataURL(file);
    var r = await fetch(apiUrl('/api/inspect'), {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ image_base64:dataUrl, region_id:regionId })
    });
    var d = await r.json();
    if(!r.ok || d.error) throw new Error(d.error || ('HTTP ' + r.status));
    var x = sceneFromApi(d);
    var lr = L_from_count(x.count.n), sr = S_from_work(x.work.type);
    var g = grade(lr.L, sr.S);
    var ev = (d.events || [])[0];
    var st = {};
    x.verdicts.forEach(function(v){ st[v.state] = (st[v.state] || 0) + 1; });
    var head = '**上传图片实测**（' + modelName() + ' · ' + x.verdicts.length + ' 人）\n\n'
      + Object.keys(st).map(function(y){ return y + ' ' + st[y]; }).join('、') + '。\n\n';
    if(d.scene_check && d.scene_check.ok === false){
      head += '> 注意：' + (d.scene_check.reason || '该图疑似非作业全景')
        + '，本次判定仅供参考；换一张包含完整作业面的照片更准。\n\n';
    }
    var body = ev
      ? '定级：R = ' + ev.L + ' × ' + ev.S + ' = **' + ev.R + '**，' + ev.grade + '，' + ev.action + '。\n'
      : '**没有确认违规，直接放行**，不开工单。\n';
    var card = {
      tone: toneOfLevel(g.level), verdicts: x.verdicts,
      risk: { R:g.R, L:g.L, S:g.S, level:g.level, deadline:g.deadline },
      ticket: x.ticket, checks: x.checks, law: x.law,
      _clean: x._clean
    };
    if(x._clean){ card.tone = 'ok'; card.risk = null; }
    addMsg('assistant', head + body + '\n```anxun\n' + JSON.stringify(card) + '\n```\n');
    renderConvo(); enterLast(); toBottom(true);
  }catch(e){
    toast('实测失败：' + (e.message || e));
  }
}

async function refreshModelScene(k, silent){
  var sid = MODEL.map[k];
  if(!MODEL.ready || !sid || MODEL.busy[k]) return;
  if(MODEL.cache[k]){
    applyModelScene(k, MODEL.cache[k]);
    if(S.scene === k) renderPanel();
    return;
  }
  MODEL.busy[k] = true;
  try{
    var r = await fetch(apiUrl('/api/inspect'), {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ scene_id:sid })
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    var d = await r.json();
    if(d.error) throw new Error(d.error);
    MODEL.cache[k] = d;
    applyModelScene(k, d);
    if(S.scene === k) renderPanel();
    if(!silent) toast('已用 ' + modelName() + ' 重跑 ' + sid + '：' + ((d.persons || []).length) + ' 人 / ' + ((d.events || []).length) + ' 条违规');
  }catch(e){
    MODEL.ready = false;
    paintStatus();
    if(!silent) toast('模型服务不可用：' + (e.message || e) + '（已回到示例数据）');
  }finally{
    MODEL.busy[k] = false;
  }
}

   所以这套只在发布域名下生效，本地 127.0.0.1 会失败并自动退回演示数据。 */

/* 按任务复杂度分档，便宜优先，不够再升：
   0 免费档 hy4free         x0.00  寒暄、单句事实
   1 快速档 fast-model      x0.15  常规研判（要调工具、要说人话）
   2 均衡档 balanced-model  x0.50  多步分析、对比、长文

var TIERS = [

  { id:'balanced-model', name:'均衡档', cost:'x0.50' },
  { id:'deep-model',     name:'深度档', cost:'x1.00' }
];
var DOMAIN_RE = /风险|等级|定级|工单|整改|法规|条文|条款|安全帽|反光背心|背心|判定|置信|违规|隐患|区域|场景|巡检|L\s*[=×]|S\s*[=×]|R\s*=/;
var COMPLEX_RE = /对比|比较|分析|评估|方案|总结|分别|多种|多个|为什么|原因|推导|流程|闭环|权衡/;

/* 成本档位：'save' 省钱优先（默认，一律从免费档起，撑不住才升）
             'balanced' 按复杂度分档    'quality' 质量优先（领域问题直接快速档起）
   改这一个常量就能切换整体策略。 */
/* 演示默认走「质量优先」。
   'save' 一律从免费档 hy4free 起，实测一次研判要 215 秒才出结果
   （40 s 才出第一条工具 trace，210 s 才出第一个字），
   评委面前等于白屏三分钟——省下的那点倍率不值。
   省钱路径仍在，改成 'save' 即可，但别在演示机上用。 */
var COST_MODE = 'quality';

function whyTier(q){
  var t = String(q || '');
  if(COST_MODE === 'save') return '省钱优先：默认免费档';
  if(t.length > 160) return '长问题（' + t.length + ' 字）';
  if(COMPLEX_RE.test(t)) return '多步/分析型提问';
  if(DOMAIN_RE.test(t)) return '厂区研判类提问';
  return t.length <= 12 ? '短问或寒暄' : '普通提问';
}

/* 只决定**起点**，运行时还会按失败升档。
   save：一律 0（免费），长/难问题也先试免费，撑不住再升——代价是慢一点，收益是 0 倍率。
   balanced：按复杂度 0/1/2。 quality：领域问题至少 1，分析型直接 2。 */
function pickTier(q){
  var t = String(q || '');
  if(COST_MODE === 'save') return 0;
  if(COST_MODE === 'quality'){
    // 领域问题先给快速档：研判类提问必然命中 DOMAIN_RE，
    // 排在 COMPLEX_RE 前面才不会因为一句「为什么」直接跳到均衡档（耗时翻倍）。
    if(t.length > 200) return 2;
    if(DOMAIN_RE.test(t)) return 1;
    if(COMPLEX_RE.test(t)) return 2;
    return 0;
  }
  if(t.length > 160 || COMPLEX_RE.test(t)) return 2;
  if(t.length > 60 && DOMAIN_RE.test(t)) return 2;
  if(DOMAIN_RE.test(t)) return 1;
  return t.length <= 12 ? 0 : 1;
}

function lastUserText(c){
  var msgs = (c && c.msgs) || [];
  for(var i = msgs.length - 1; i >= 0; i--){
    if(msgs[i].role === 'user') return msgs[i].content || '';
  }
  return '';
}

    CLOUD.avail = {}; CLOUD.names = {}; CLOUD.tools = {};
    list.forEach(function(m){
      if(m.disabled === true) return;
      CLOUD.avail[m.id] = true;
      CLOUD.names[m.id] = m.name || m.id;
      CLOUD.tools[m.id] = m.supportsToolCall === true;
    });

function cloudErrText(e){
  var code = (e && e.error && e.error.code) || '';
  if(/^quota_/.test(code)) return '云端额度不足或触发限流，稍后再试';
  if(/^auth_/.test(code)) return '云端鉴权失败（发布域名不匹配，或环境未启用）';
  if(/^gateway_|^model_/.test(code)) return '模型服务暂时不可用，点「重新生成」再试';
  if(/^request_/.test(code)) return '模型不接受这个请求：' + ((e.error && e.error.message) || code);
  return '云端调用失败：' + ((e && e.message) || code || '未知错误');
}

/* 云端要求 messages[0] 是应用的 system，且不认两条 system：
   把 SYS 与场景上下文合成一条再发。 */
function cloudMessages(c){
  var sys = sysText() + '\n\n' + (SCENE_CTX[S.scene] || '');
  var msgs = [{ role:'system', content: sys }];
  c.msgs.slice(0, -1).forEach(function(x){
    // 只带当前场景的历史。切换到 B 之后还把 C 的对话塞进去，
    // 模型会拿着 C 的 8 人违规数据回答「B 场景什么等级」。
    if(x.scene && x.scene !== S.scene) return;
    if(x.role === 'user' || x.role === 'assistant') msgs.push({ role:x.role, content:x.content });
  });
  return msgs;
}

/* 一次完整的「工具循环 + 收尾」，返回这一档有没有说出正文 */
/* 有些模型不走结构化 tool_calls，而是把调用当正文吐：
     <tool_call>law_lookup<arg_key>code</arg_key><arg_value>…</arg_value></tool_call></think>
   直接把这段渲染出去，评委看到的就是一屏 XML。这里统一剥掉。 */
function cleanModelText(t){
  return String(t || '')
    .replace(/<tool_call>[\s\S]*?<\/tool_call>/g, ' ')
    .replace(/<think>[\s\S]*?<\/think>/g, ' ')
    .replace(/<\/?think>/g, ' ')
    .replace(/<arg_key>[\s\S]*?<\/arg_value>/g, ' ')
    .replace(/<\/?[a-z_][a-z0-9_]*\s*>/gi, ' ')
    .replace(/[ \t]{2,}/g, ' ')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

/* 坏输出判定：有些模型在工具调用出岔子之后会退化成「把参数一路念下去」，
   例如 law_lookup」 law_lookup _article … _code … _query … 连着念上百个字，
   或者把提示词里根本没出现过的指令抄回来。这种文本对用户没有任何信息量，
   与其显示出来不如直接丢掉、升一档重试。 */
function looksBroken(t){
  if(!t) return false;
  var head = t.slice(0, 2500);
  var marks = (head.match(/\s_[a-z_]{2,}\s/g) || []).length;   // 念参数：_article _code _query
  if(marks >= 6) return true;
  if(head.indexOf('【工单】') >= 0) return true;                  // 凭空抄出一段指令
  var compact = head.replace(/\s/g, '');
  for(var len = 14; len <= 26; len += 6){
    for(var i = 0; i + len * 3 <= compact.length; i += 3){
      var seg = compact.substr(i, len);
      var n = compact.split(seg).length - 1;
      if(n >= 3) return true;                                    // 同一段重复 3 次以上
    }
  }
  return false;
}

async function cloudAttempt(c, tier, signal, onDelta, onTrace){
  var messages = cloudMessages(c);
  var useTools = CLOUD.tools[tier.id] === true;
  var spoke = false;
  function emit(t){ spoke = true; onDelta(t); }

  for(var round = 0; round < 3; round++){
    var req = { model: tier.id, messages: messages, stream: true, temperature: 0.3 };
    if(signal) req.signal = signal;
    if(useTools && round < 2){ req.tools = TOOLS; req.tool_choice = 'auto'; }

    var acc = '', calls = [];
    // 没有超时的 for await 会一直挂着：实测免费档 60 s 不返回，
    // 界面就永久停在「生成中」，升档逻辑永远走不到。
    var wt = withTimeout(signal, CLOUD_TIMEOUT_MS);
    req.signal = wt.signal;
    try {
    for await (var chunk of CLOUD.client.llm.chat.completions.create(req)){
      var ch = chunk.choices && chunk.choices[0];
      var d = ch && ch.delta;
      if(d && d.content){ acc += d.content; }   // 先攒，洗完再吐，避免漏出 XML
      if(d && d.tool_calls){
        for(var k = 0; k < d.tool_calls.length; k++){
          var tc = d.tool_calls[k];
          var cur = calls[tc.index] || { id:'', type:'function', function:{ name:'', arguments:'' } };
          if(tc.id) cur.id = tc.id;
          if(tc.function && tc.function.name) cur.function.name = tc.function.name;
          if(tc.function && tc.function.arguments) cur.function.arguments += tc.function.arguments;
          calls[tc.index] = cur;
        }
      }
    }
    } finally { wt.done(); }
    var clean = calls.filter(Boolean);
    if(!clean.length){
      // 这一轮没调工具，acc 才是正文。先清洗，再按小段吐出去（保留打字感）。
      var txt = cleanModelText(acc);
      if(looksBroken(txt)){
        var bad = new Error('模型输出退化，换档重试');
        bad.error = { code:'degenerate' };
        throw bad;
      }
      for(var ci = 0; ci < txt.length; ci += 28){
        emit(txt.slice(ci, ci + 28));
        await sleep(10);
      }
      break;
    }

    messages.push({ role:'assistant', content: acc || '', tool_calls: clean });
    for(var i = 0; i < clean.length; i++){
      var one = clean[i];
      var args = {};
      try{ args = JSON.parse(one.function.arguments || '{}'); }catch(e){}
      var out;
      try{ out = runTool(one.function.name, args); }
      catch(e){ out = { error: String(e && e.message || e) }; }
      if(onTrace) onTrace({ name: one.function.name, args: args, out: out });
      messages.push({ role:'tool', tool_call_id: one.id, content: JSON.stringify(out) });
    }
  }

  // 兜底：工具走完却一个字没写（便宜模型常见），再要一次纯文本结论
  if(!spoke){
    var fin = {
      model: tier.id,
      messages: messages.concat([{ role:'user', content:'基于上面的工具结果，用中文直接给出最终结论，不要再调用工具。' }]),
      stream: true,
      temperature: 0.3
    };
    if(signal) fin.signal = signal;
    var finAcc = '';
    for await (var c2 of CLOUD.client.llm.chat.completions.create(fin)){
      var d2 = c2.choices && c2.choices[0] && c2.choices[0].delta;
      if(d2 && d2.content) finAcc += d2.content;
    }
    var finTxt = cleanModelText(finAcc);
    for(var fi = 0; fi < finTxt.length; fi += 28){
      emit(finTxt.slice(fi, fi + 28));
      await sleep(10);
    }
  }
  return spoke;
}

async function cloudRun(c, signal, onDelta, onTrace){
  var q = lastUserText(c);
  var start = pickTier(q);
  var tried = [];
  for(var t = start; t < TIERS.length; t++){
    var tier = TIERS[t];
    if(!CLOUD.avail[tier.id]) continue;
    tried.push(tier.name);
    // 不把「档位 / 倍率 / hy4free」这类内部成本策略写进对话。
    // 评委要看到的是「系统在算什么」，不是「这个回答花了多少钱」。
    try{
      if(await cloudAttempt(c, tier, signal, onDelta, onTrace)){
        CLOUD.model = tier.id;
        CLOUD.modelName = CLOUD.names[tier.id] || tier.id;
        CLOUD.supportsTools = CLOUD.tools[tier.id] === true;
        S.model = CLOUD.modelName;
        paintStatus();
        return;
      }
      // 升档是内部重试，用一句普通提示，不进 trace
      if(t > start) toast('这一档没给出结论，正在换更强的模型重试…');
    }catch(e){
      var code = (e && e.error && e.error.code) || '';
      if(/^quota_|^auth_|^request_/.test(code)) throw e;   // 不是模型能力问题，升档也没用
      if(t > start) toast('这一档调用失败，正在换更强的模型重试…');
    }
  }
  throw new Error('云端模型都没有给出结果（已尝试：' + tried.join('、') + '）');
}

/* 本轮真实阈值：从 /api/inspect 的 thresholds 读，读不到就用 v3 默认。
   原来 SYS 与左下角写死「0.20–0.30 转人工复核」，而实际 conf_final=0.65 ——
   模型照着错的数字解释判定，页面同一屏还会出现 0.30 和 0.65 两个口径。 */
var THR = { conf_final: 0.65, conf_review: 0.20, profile: 'v3' };
function sysText(){
  return SYS.join('\n')
    .replace(/\{CF\}/g, THR.conf_final)
    .replace(/\{CR\}/g, THR.conf_review);
}
function applyThresholds(thr){
  if(!thr || thr.conf_final == null) return;
  THR.conf_final = thr.conf_final;
  THR.conf_review = thr.conf_review != null ? thr.conf_review : THR.conf_review;
  THR.profile = thr.profile || THR.profile;
  var a = document.getElementById('footConf'), b = document.getElementById('footReview');
  if(a) a.textContent = THR.conf_final;
  if(b) b.textContent = THR.conf_review;
}

/* 还没拿到实测结果时的兜底文案。措辞必须写明「示例」，
   否则模型会把 4 人假数据当成 best.pt 的判定结果说出去。 */
var SCENE_CTX = {

function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

/* 聊天记录放在 localStorage：
   - 连 trace（工具调用轨迹）一起存，刷新后还能看到「risk_factors → L=4 · S=4」；
   - localStorage 只有 5 MB 左右，超了先丢最老的会话，保证当前这条存得下；
   - 生成过程中每 3 秒存一次（见 reply），刷新/切走不至于只剩半句。 */
var STORE_LIMIT = 3.2 * 1024 * 1024;     // 留出余量，别把配额打满
function save(){
  try{
    var payload = {
      scene: S.scene, active: S.active,
      convos: S.convos.map(function(c){
        return { id:c.id, title:c.title, ts:c.ts, msgs:c.msgs.map(function(m){
          return {
            role:m.role, content:m.content, ts:m.ts, scene:m.scene, demo:m.demo,
            img:m.img || null,
            trace:(m.trace && m.trace.length) ? m.trace : null
          };
        })};
      })
    };
    var raw = JSON.stringify(payload);
    while(raw.length > STORE_LIMIT && payload.convos.length > 1){
      payload.convos.pop();               // convos 是新的在前，pop 丢最老的
      raw = JSON.stringify(payload);
    }
    localStorage.setItem(STORE_KEY, raw);
  }catch(e){
    // 配额满 / 隐私模式禁用存储：不要静默失败，至少让用户知道这一轮没存上
    if(!save._warned){
      save._warned = true;
      try{ toast('浏览器存不下更多聊天记录，已保留当前会话'); }catch(_){}
    }
  }
}
function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return false;
    var d = JSON.parse(raw);
    if(!d || !d.convos) return false;
    S.convos = d.convos;
    S.scene = SCENES[d.scene] ? d.scene : 'B';
    S.active = d.active || (d.convos[0] && d.convos[0].id) || null;
    return true;
  }catch(e){ return false; }
}

/* ---------------- 轻量 Markdown ---------------- */
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, function(_, c){ return '<code>' + c + '</code>'; });
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src){
  var lines = String(src).replace(/\r\n/g, '\n').split('\n');
  var out = [], buf = [], inUl = false, inOl = false, table = null;

  function flushList(){
    if(inUl){ out.push('</ul>'); inUl = false; }
    if(inOl){ out.push('</ol>'); inOl = false; }
  }
  function flushTable(){
    if(table){ out.push(table); table = null; }
  }
  function flushAll(){ flushList(); flushTable(); if(buf.length){ out.push('<p>' + inline(buf.join(' ')) + '</p>'); buf = []; } }

  for(var i=0;i<lines.length;i++){
    var ln = lines[i], t = ln.trim();

    if(/^```/.test(t)){
      flushAll();
      var lang = t.slice(3).trim();
      var code = [];
      i++;
      while(i < lines.length && !/^```/.test(lines[i].trim())){ code.push(lines[i]); i++; }
      out.push('<pre><code data-lang="' + esc(lang) + '">' + esc(code.join('\n')) + '</code></pre>');
      continue;
    }

    if(!t){ flushAll(); continue; }

    if(/^#{1,4}\s+/.test(t)){
      flushAll();
      var lv = t.match(/^#+/)[0].length;
      out.push('<h3>' + inline(t.replace(/^#+\s+/, '')) + '</h3>');
      continue;
    }

    if(/^>\s?/.test(t)){
      flushAll();
      out.push('<blockquote>' + inline(t.replace(/^>\s?/, '')) + '</blockquote>');
      continue;
    }

    // 表格
    if(/\|/.test(t) && /^\|?.*\|/.test(t)){
      var cells = t.replace(/^\||\|$/g, '').split('|').map(function(x){ return x.trim(); });
      if(/^[\s:|-]+$/.test(t.replace(/\|/g, ''))){
        continue; // 分隔行
      }
      if(!table){
        flushList();
        table = '<table><thead><tr>' + cells.map(function(c){ return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
      }else{
        table += '<tr>' + cells.map(function(c){ return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
      }
      // 下一行不是表格则收尾
      var nx = (lines[i+1]||'').trim();
      if(!nx || !/\|/.test(nx)){ table += '</tbody></table>'; out.push(table); table = null; }
      continue;
    }
    if(table){ table += '</tbody></table>'; out.push(table); table = null; }

    if(/^[-*+]\s+/.test(t)){
      flushTable();
      if(!inUl){ out.push('<ul>'); inUl = true; }
      out.push('<li>' + inline(t.replace(/^[-*+]\s+/, '')) + '</li>');
      continue;
    }
    if(/^\d+[.)]\s+/.test(t)){
      flushTable();
      if(!inOl){ out.push('<ol>'); inOl = true; }
      out.push('<li>' + inline(t.replace(/^\d+[.)]\s+/, '')) + '</li>');
      continue;
    }

    flushList();
    buf.push(t);
  }
  flushAll();
  return out.join('');
}

/* ---------------- 规则引擎：唯一算数的地方 ---------------- */
var LAW_DB = [
  { code:'安全生产法 第四十五条', verbatim:true, text:'生产经营单位必须为从业人员提供符合国家标准或者行业标准的劳动防护用品，并监督、教育从业人员按照使用规则佩戴、使用。' },
  { code:'安全生产法 第四十三条', verbatim:true, text:'生产经营单位进行爆破、吊装、动火、临时用电以及国务院应急管理部门会同国务院有关部门规定的其他危险作业，应当安排专门人员进行现场安全管理，确保操作规程的遵守和安全措施的落实。' },
  { code:'GB 2811-2019 安全帽', verbatim:false, text:'头部防护装备的技术要求与使用规范；高处作业应全程佩戴并系紧下颏带。' },
  { code:'GB 30871-2022 特殊作业安全规范', verbatim:false, text:'动火、受限空间等特殊作业应办理作业票，由审批人现场核查并签字批准。' },
  { code:'GB 39800.1-2020 个体防护装备配备规范', verbatim:false, text:'用人单位应按作业风险为从业人员配备个体防护装备，并监督其正确佩戴、使用。' }
];

function normLaw(s){ return String(s || '').replace(/\s+/g,'').replace(/[（）()]/g,''); }
/* 严格匹配：必须带条号或标准编号，避免「只说法名」就误命中某一条 */
function matchLaw(code){
  var k = normLaw(code);
  if(!k) return null;
  var hasClauseNo = /第[一二三四五六七八九十百零\d]+条/.test(k) || /GB\s*\d{4,5}/.test(k);
  if(!hasClauseNo) return null;
  for(var i=0;i<LAW_DB.length;i++){
    var n = normLaw(LAW_DB[i].code);
    if(k === n || k.indexOf(n) >= 0 || n.indexOf(k) >= 0) return LAW_DB[i];
  }
  return null;
}

function clampInt(v, lo, hi){
  var n = Math.round(Number(v));
  if(!isFinite(n)) return null;
  return Math.max(lo, Math.min(hi, n));
}

/* R = L × S；等级与时限由 R 唯一决定，模型无权给 */
function grade(L, S){
  L = clampInt(L, 1, 4); S = clampInt(S, 1, 4);
  if(L === null || S === null) return null;
  var R = L * S;
  if(R >= 13) return { R:R, L:L, S:S, level:'红色', deadline:'2 小时内',  tone:'bad'  };
  if(R >= 9)  return { R:R, L:L, S:S, level:'橙色', deadline:'24 小时内', tone:'warn' };
  if(R >= 5)  return { R:R, L:L, S:S, level:'黄色', deadline:'7 天内',    tone:'gold' };
  return            { R:R, L:L, S:S, level:'蓝色', deadline:'30 天内',    tone:'info' };
}

/* 紧急程度 A/B/C —— 对外只讲这一套，比红橙黄蓝好记，
   也不再把 A/B/C 当场景名：A 立即、B 当日、C 限期。由 R 唯一决定。 */
function urgencyOf(R){
  if(R == null) return null;
  if(R >= 13) return { code:'A', name:'紧急', note:'立即处置', tone:'bad'  };
  if(R >= 9)  return { code:'B', name:'较急', note:'当日处置', tone:'warn' };
  return            { code:'C', name:'一般', note:'限期处置', tone:'gold' };
}

/* 模型文件名按后端返回：本地 GPU 是 best.pt，线上 ONNX 是 best.onnx。
   以前文案里写死 best.pt，部署版会标错文件名。 */
function modelName(){
  return (MODEL.info && MODEL.info.name) || 'best.pt';
}

function pad3(n){ n = String(n); while(n.length < 3){ n = '0' + n; } return n; }
function dateCode(){ var d = new Date(); return ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2); }

/* 工单号：场景 + 日期，纯确定性；工具和卡片算出来必然一致 */
function ticketNoFor(sceneId){
  var sc = String(sceneId || S.scene).toUpperCase();
  if(!SCENES[sc]) sc = S.scene;
  // 前缀跟服务端保持一致（服务端是 TK-…）；原来这里是 GD-，
  // 演示模式显示 GD-B-1109、跑起服务又变 TK-2026…，同一件东西两套编号。
  return 'TK-' + sc + '-' + dateCode();
}

/* 把模型给的卡片"过一遍引擎"：能算的全算，能校验的全校验 */
function normalizeCard(card, sceneId, idx){
  if(!card || typeof card !== 'object') return card;
  var s = SCENES[sceneId] || SCENES.B;

  // 放行场景（实测 0 违规）：不摆风险卡，也不补一个「假如违规」的等级
  if(card._clean){
    card.tone = 'ok';
    card.risk = null;
    card.ticket = null;
    return card;
  }

  var r = card.risk || {};
  var L = r.L, S = r.S;
  if(L == null || S == null){ var rk = sceneRisk(sceneId) || {}; L = rk.L; S = rk.S; card._fallback = true; }
  var g = grade(L, S);
  if(g){
    card.risk = { R:g.R, L:g.L, S:g.S, level:g.level, deadline:g.deadline };
    card.tone = g.tone;
  }else{
    card._fallback = true;
  }

  // 工单号：服务端开过单就用系统的 TK- 号。
  // 原来只判「不是 TK 就换成 GD-」，于是模型从提示词里照抄 GD-B-0932，
  // 屏幕右栏是 TK-2026…-B-01-vest-01、对话卡片是 GD-B-1109，同一个单两个号。
  if(card.ticket){
    var sysT = (SCENES[sceneId] && SCENES[sceneId].ticket) || null;
    var sysNo = sysT && sysT.no ? String(sysT.no) : '';
    // 卡片自己的号如果是完整服务端号（TK-20261110…-B-01-vest-01），就别用样例短号覆盖，
    // 否则正文写 TK-2026…、卡片却是 TK-B-0932，又变成一单两号。
    if(/^TK-\d{8,}/.test(String(card.ticket.no || ''))) sysNo = String(card.ticket.no);
    if(/^TK-/.test(sysNo)){
      card.ticket.no = sysNo;
      // 整改要求只认服务端按实测装备与人数生成的那句。
      // 模型自己写的那版出现过「未戴反光背心却补发安全帽 4 顶」这种对不上的内容。
      if(sysT.action) card.ticket.action = sysT.action;
      card.ticket.owner = '';
      card.ticket.reviewer = '';
    }else if(!/^TK-/.test(String(card.ticket.no || ''))){
      card.ticket.no = ticketNoFor(sceneId);
    }
  }

  if(card.law && card.law.length){
    card.law = card.law.map(function(l){
      var hit = matchLaw(l && l.code);
      if(hit) return { code: hit.code, text: hit.text, ok:true, verbatim: !!hit.verbatim };
      return { code: (l && (l.code || l.name)) || '未标注条款', text:'（该条款不在本项目条文库内，需人工核对原文后再对外引用）', ok:false, verbatim:false };
    });
  }
  return card;
}

  return map[tone] || [tone, 't-mute'];
}

function renderPanel(){

    if(card.ticket.action) h += '<div class="kv" style="display:block"><span style="display:block;margin-bottom:3px">整改要求</span><span>' + esc(cleanReq(card.ticket.action)) + '</span></div>';

var _lastShownR = null;      // 上一次已经滚过的 R 值
function animateNumbers(){
  var st = document.body.classList.contains('static');
  var el0 = document.querySelector('#pbody .R[data-count]');
  var target0 = el0 ? +el0.getAttribute('data-count') : null;
  // R 没变就别重播：renderPanel 会因为 refreshModelScene / 切场景被调多次，
  // 每次都从 0 滚一遍，投屏时能看到 0→13→0→16 乱跳，中间那帧是错的数。
  if(st || target0 === _lastShownR){
    $$('#pbody .R[data-count]').forEach(function(el){
      el.textContent = el.getAttribute('data-count');
    });
    $$('#pbody .meter i[data-w]').forEach(function(el){
      el.style.width = el.getAttribute('data-w') + '%';
    });
    _lastShownR = target0;
    return;
  }
  _lastShownR = target0;
  $$('#pbody .R[data-count]').forEach(function(el){
    var target = +el.getAttribute('data-count');
    var t0 = performance.now(), dur = 620;
    function step(t){
      var k = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3)));
      if(k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
  $$('#pbody .meter i[data-w]').forEach(function(el){
    requestAnimationFrame(function(){ el.style.width = el.getAttribute('data-w') + '%'; });
  });
}

function renderList(){

function convo(id){
  for(var i=0;i<S.convos.length;i++) if(S.convos[i].id === id) return S.convos[i];
  return null;
}
function ensureConvo(){
  var c = convo(S.active);
  if(c) return c;
  c = { id: uid(), title:'新对话', ts: Date.now(), msgs: [] };
  S.convos.unshift(c);
  S.active = c.id;
  return c;
}
/* 只让「刚出现的那条」播一次入场动画。
   以前动画挂在 .msg 上，每次重建对话所有消息都重放，看起来就是闪屏。 */
function enterLast(){
  var nodes = $('#flow').querySelectorAll('.msg');
  if(nodes.length) nodes[nodes.length - 1].classList.add('enter');
}

function renderConvo(){
  var c = convo(S.active);
  var flow = $('#flow');
  if(!c || !c.msgs.length){
    flow.innerHTML = emptyHTML();
    return;
  }
  flow.innerHTML = c.msgs.map(function(m, i){ return msgHTML(m, i); }).join('');
}/* 流式输出时只重画最后一条消息的正文，避免整段 innerHTML 重建造成闪屏。
   轨迹（trace）只在新增步骤时重画一次——它每帧都重建的话，卡片会跟着抖。 */
function paintStreaming(m, idx){
  var flow = $('#flow');
  var nodes = flow.querySelectorAll('.msg');
  var el = nodes[nodes.length - 1];
  if(!el || !el.classList.contains('ai')){ renderConvo(); return; }

  var card = m.card || findCard(m.content);
  if(card) card = normalizeCard(card, m.scene || S.scene, idx);
  var text = stripCard(cleanModelText(m.content));
  // 卡片还没写完时（```anxun 未闭合），别把 JSON 原文漏在正文里
  if(m.streaming) text = text.replace(/```anxun[\s\S]*$/, '').trim();
  var bubble = el.querySelector('.bubble');
  if(!bubble){ renderConvo(); return; }
  // 云端首字要等几十秒。原来这里只有一个光标，看起来像卡死。
  var head = (!text && m.streaming && m.hint)
    ? '<div class="pending">' + esc(m.hint) + '</div>'
    : md(text);
  bubble.innerHTML = (m.img ? '<img class="shot" src="' + m.img + '" alt="上传的现场图">' : '')
    + head + (card ? compactCard(card, idx) : '')
    + (m.streaming ? '<span class="caret"></span>' : '');

  var tlen = (m.trace || []).length;
  if(tlen !== (m._tlen || 0)){
    m._tlen = tlen;
    var body = el.querySelector('.body');
    var old = body.querySelector('.trace');
    var fresh = traceHTML(m.trace);
    if(old){
      if(fresh) old.outerHTML = fresh; else old.remove();
    }else if(fresh && body.querySelector('.name')){
      body.querySelector('.name').insertAdjacentHTML('afterend', fresh);
    }
  }
}

function emptyHTML(){
  var s = SCENES[S.scene];
  return '<div class="empty">' +
    '<h1>先把「告警」变成<span>「工单」</span></h1>' +
    '<p>右侧是内置样例区域 <b>' + esc(s.name) + '</b>（' + esc(s.tag) + '）的实测结果。你可以直接问判定、定级、工单或法规，也可以上传一张现场照片换成自己的画面。</p>' +
    '<div class="sugg">' +
    '<button data-ask="risk"><span class="n">1</span>现在什么风险等级？凭什么？<span class="go">→</span></button>' +
    '<button data-ask="ticket"><span class="n">2</span>把没戴安全帽的这个人开一张整改工单<span class="go">→</span></button>' +
    '<button data-ask="law"><span class="n">3</span>这条违规触犯了哪条法规？原文怎么写的<span class="go">→</span></button>' +
    '</div></div>';
}
function traceHTML(trace){
  if(!trace || !trace.length) return '';
  // 只留业务步骤（L/S、R、条文、工单号）。模型路由与升档属于内部调度，
  // 写出来评委看到的是「档位=免费档，倍率=x0.00」，跟这个产品没关系。
  // 旧会话里可能存着这几条，渲染时一并滤掉。
  var shown = trace.filter(function(t){
    return t && t.name !== '模型路由' && t.name !== '升档重试';
  });
  if(!shown.length) return '';
  var chips = shown.map(function(t){
    var a = t.args || {}, o = t.out || {};
    var argStr = Object.keys(a).map(function(k){ return k + '=' + a[k]; }).join(', ');
    var res;
    if(t.name === 'risk_factors') res = o.error ? '错误' : ('L=' + o.L + ' · S=' + o.S);
    else if(t.name === 'grade_risk') res = o.error ? '参数不合法' : ('R=' + o.R + ' · ' + o.level);
    else if(t.name === 'law_lookup') res = o.found ? ('命中 ' + o.code) : '未收录';
    else if(t.name === 'create_ticket') res = (o.no || '已生成');
    else res = '完成';
    return '<span class="tchip"><b>' + esc(t.name) + '</b>(' + esc(argStr) + ') → ' + esc(res) + '</span>';
  }).join('');
  return '<div class="trace">' + chips + '</div>';
}

function msgHTML(m, i){
  var isMe = m.role === 'user';
  var inner;
  if(isMe){
    inner = '<div class="body"><div class="name">我</div><div class="bubble">' +
      (m.img ? '<img class="shot" src="' + m.img + '" alt="上传的现场图">' : '') +
      esc(m.content).replace(/\n/g,'<br>') + '</div></div>';
  }else{
    var card = m.card || findCard(m.content);
    if(card) card = normalizeCard(card, m.scene || S.scene, i);
    var text = stripCard(cleanModelText(m.content));
    var caret = m.streaming ? '<span class="caret"></span>' : '';
    var acts = m.streaming ? '' :
      '<div class="acts"><button data-copy="' + i + '">复制</button><button data-regen="1">重新生成</button></div>';
    inner = '<div class="body"><div class="name">安巡 Agent</div>' + traceHTML(m.trace) +

      '<div class="bubble">'
        + md(text) + (card ? compactCard(card, i) : '') + caret + '</div>' + acts + '</div>';
  }
  return '<div class="msg ' + (isMe?'me':'ai') + '"><div class="av">' + (isMe?'我':'A') + '</div>' + inner + '</div>';
}

  }

  // risk / 默认
  return '场景 **' + s.id + ' · ' + s.name + '**：R = ' + rk.L + ' × ' + rk.S + ' = **' + rk.R + '**，' +
    rk.level + '，整改时限 **' + rk.deadline + '**。\n\n' +
    '- **L = ' + rk.L + '**：' + rk.Lwhy + '\n' +
    '- **S = ' + rk.S + '**：' + rk.Swhy + '\n' +
    '- 判定：共 ' + s.verdicts.length + ' 人，未佩戴 ' + s.verdicts.filter(function(v){return v.tone==='bad';}).length + ' 人，其余按四态分流\n\n' +
    '为什么要分开写 L 和 S：同一顶没戴的安全帽，在通道里是 24 小时的橙色，在高处平台是 2 小时的红色——' +
    '**告警相同，责任不同**，差别全在 L 和 S 上；而 L 和 S 都不是模型拍的，是照规则表推出来的。\n\n' +
    '```anxun\n' + JSON.stringify(card) + '\n```\n';
}

/* ---------------- 发送 / 流式 ---------------- */
function addMsg(role, content, img){
  var c = ensureConvo();
  var m = { role: role, content: content, ts: Date.now(), scene: S.scene };
  if(img) m.img = img;
  c.msgs.push(m);
  if(role === 'user' && (c.title === '新对话' || !c.title)){
    c.title = content.slice(0, 18) + (content.length > 18 ? '…' : '');
  }
  save(); renderList();
  return m;
}

async function send(){
  var ta = $('#input');
  var q = ta.value.trim();
  if(!q || S.busy) return;
  ta.value = ''; autoGrow(ta);
  addMsg('user', q);
  renderConvo(); enterLast();
  toBottom(false);
  await reply(q);
}

async function reply(q){
  var c = ensureConvo();
  if(c.msgs.length && c.msgs[c.msgs.length-1].role === 'assistant') return;

  S.busy = true; setBusy(true);

  // 生成过程定时落盘：云端一次十几到几十秒，中途刷新/切标签不至于只留下半句
  var autosave = setInterval(function(){ save(); }, 3000);

  var m = { role:'assistant', content:'', ts:Date.now(), streaming:true, scene:S.scene,
            demo:(S.mode !== 'live'), hint:'正在连接模型…' };
  c.msgs.push(m);

  var acc = '';
  var ctrl = new AbortController();
  S.abort = ctrl;
  var lastPaint = 0;

  function paint(force){
    var now = Date.now();
    if(!force && now - lastPaint < 50) return;
    lastPaint = now;
    var stick = atBottom();
    m.content = acc;
    if(acc && !S.verified){ S.verified = true; paintStatus(); }
    if(acc) m.hint = '';
    paintStreaming(m, c.msgs.length - 1);
    if(stick) toBottom(false);
  }

  renderConvo(); enterLast();
  toBottom(false);

  // 场景实测还没回来就先等它。否则 SCENE_CTX 还是那套示例文案（4 人假数据），
  // 模型会照着假数据答，右栏却已经是实测的 1 人 / 10 人，两边对不上。
  if(MODEL.ready && !MODEL.cache[S.scene]){
    m.hint = '正在用 ' + modelName() + ' 读当前场景…';
    paint(true);
    try{ await refreshModelScene(S.scene, true); }catch(e){}
    for(var wi = 0; wi < 30 && !MODEL.cache[S.scene]; wi++) await sleep(150);
    m.hint = '正在连接模型…';
    paint(true);
  }

  try{
    if(S.transport === 'cloud' && CLOUD.ready){
      await cloudRun(c, ctrl.signal, function(delta){ acc += delta; paint(false); }, function(step){
        m.trace = m.trace || [];
        m.trace.push(step);
        m.hint = '正在调用 ' + step.name + '…';
        paint(true);
      });
    }else{
      // 只剩云端一条路。连不上就明说，不再退回到预置回答——
      // 「演示模式」四个字一旦出现在演示现场，前面的实测全部白讲。
      acc = '云端模型还没连上。点右上角状态条重试，或刷新页面。';
    }
  }catch(e){
    if(ctrl.signal.aborted){
      if(!acc) acc = '（已停止）';
    }else if(!acc){
      acc = (S.transport === 'cloud') ? cloudErrText(e) : ('出错了：' + (e && e.message ? e.message : e));
    }
  }finally{
    clearInterval(autosave);
    m.streaming = false;
    m.content = acc;
    // 卡片不重复：同一会话里已经给过一张，后面追问就只回文字。
    // 之前每答一次都挂同一张「研判结果 / 16 / A 级」，看起来像在复读。
    var allowCard = (function(){
      var asked = '';
      for(var qi = c.msgs.length - 2; qi >= 0; qi--){
        if(c.msgs[qi].role === 'user'){ asked = c.msgs[qi].content || ''; break; }
      }
      var wantsTicket = /工单|开单|整改单|重新开/.test(asked);
      // 纯法规问题不带卡片：问「触犯哪条」时，卡片上的 R/等级是答非所问
      var lawOnly = /法规|条文|第几条|哪条|依据/.test(asked) && !wantsTicket;
      var hadCard = c.msgs.slice(0, -1).some(function(x){
        return x.role === 'assistant' && (x.card || findCard(x.content));
      });
      var ok = !((hadCard && !wantsTicket) || lawOnly);
      if(!ok) m.content = stripCard(m.content);
      return ok;
    })();

    // 正文提到工单号但没给卡片，补一张，保证「导出工单」按钮在。
    // 注意：必须受 allowCard 约束，否则刚剥掉的卡会被这里重新补回来。
    if(allowCard && !findCard(m.content) && /TK-\d/.test(m.content)){
      var gc = cardFromScene(m.scene || S.scene);
      if(gc) m.card = gc;
    } else if(!allowCard){
      m.card = null;
    }
    S.busy = false; S.abort = null; setBusy(false);
    renderConvo();
    toBottom(false);
    setTimeout(function(){ $('#jump').classList.toggle('on', !atBottom()); }, 400);
    save(); renderList();
  }
}

/* ---------------- Agent：工具调用 ---------------- */
var TOOLS = [
  { type:'function', function:{
    name:'risk_factors',
    description:'按现场事实推导 L（可能性）与 S（严重性）：传违规次数与作业类型，返回 L、S 及判定依据。凡涉及定级，必须先调用它拿 L/S。',
    parameters:{ type:'object',
      properties:{
        violation_count:{ type:'integer', description:'近 30 天同类违规次数' },
        work_type:{ type:'string', description:'作业类型：普通作业 / 车辆作业 / 高处作业 / 动火作业 / 受限空间' },
        violation_scale:{ type:'integer', description:'本次单次违规人数（可选；不传则用当前场景实测的未佩戴人数）' }
      },
      required:['violation_count','work_type'] } } },
  { type:'function', function:{
    name:'grade_risk',
    description:'按 R = L × S 计算风险等级与整改时限。L、S 必须来自 risk_factors 的返回值。',
    parameters:{ type:'object',
      properties:{ L:{ type:'integer', description:'可能性 L，1–4 的整数' },
                  S:{ type:'integer', description:'严重性 S，1–4 的整数' } },
      required:['L','S'] } } },
  { type:'function', function:{
    name:'law_lookup',
    description:'在项目条文库里查法规原文。引用任何条款之前必须先查；查不到就不要引用。',
    parameters:{ type:'object',
      properties:{ query:{ type:'string', description:'法规名或条款号，例如「安全生产法 第四十五条」' } },
      required:['query'] } } },
  { type:'function', function:{
    name:'create_ticket',
    description:'生成整改工单（工单号由系统生成，不要自己编）。',
    parameters:{ type:'object',
      properties:{ scene:{ type:'string', description:'场景编号 A/B/C' },
                  level:{ type:'string', description:'风险等级，如「红色」' },
                  action:{ type:'string', description:'整改要求' } },
      required:['scene','level'] } } }
];

function runTool(name, args){
  var a = args || {};
  if(name === 'risk_factors'){
    // 本次规模默认取当前场景的实测违规人数：模型只会传历史次数，
    // 不补这一项的话，10 人违规它照样算 L=1、R=3 蓝色，和接口结论打架。
    var scn = SCENES[S.scene] || {};
    var scale = (a.violation_scale != null) ? a.violation_scale
              : ((scn.count && scn.count.scale) || 0);
    var lr = L_from_count(a.violation_count, scale);
    var sr = S_from_work(a.work_type);
    return {
      L: lr.L, S: sr.S,
      L_basis: lr.scaleN
        ? ('历史 ' + a.violation_count + ' 次→L' + lr.baseL + '；本次 ' + lr.scaleN + ' 人同发→L' + lr.L + '，取高者')
        : lr.note,
      S_basis: sr.note,
      violation_scale: scale
    };
  }
  if(name === 'grade_risk'){
    var g = grade(a.L, a.S);
    return g ? { R:g.R, level:g.level, deadline:g.deadline, L:g.L, S:g.S } : { error:'L 或 S 不是 1–4 的整数' };
  }
  if(name === 'law_lookup'){
    // 按装备直接映射到条文：模型常拿「未穿戴反光背心」去匹配，
    // 字面上碰不到条文名，就一律回「未收录」，等于把能引的条款也说没了。
    var q = String(a.query || '');
    var BY_EQUIP = [
      [/反光背心|背心|vest/i,  'GB 39800.1-2020 个体防护装备配备规范'],
      [/安全帽|头盔|helmet/i,   '安全生产法 第四十五条'],
      [/护目镜|眼镜|goggles/i, 'GB 39800.1-2020 个体防护装备配备规范']
    ];
    for(var ei = 0; ei < BY_EQUIP.length; ei++){
      if(BY_EQUIP[ei][0].test(q)){
        var eq = matchLaw(BY_EQUIP[ei][1]);
        if(eq) return { found:true, code:eq.code, text:eq.text };
      }
    }
    var hit = matchLaw(a.query);
    return hit ? { found:true, code:hit.code, text:hit.text }
               : { found:false, note:'项目条文库未收录该条款，不得引用' };
  }
  if(name === 'create_ticket'){
    var sc = String(a.scene || S.scene).toUpperCase();
    var scene = SCENES[sc] || SCENES[S.scene];
    var rk = sceneRisk(sc) || { level:'' };
    // 服务端已经为这个场景开过单，就把系统单号给它。
    // 否则模型会拿着 ticketNoFor() 拼的 GD-C-1109 去写正文，
    // 而右栏卡片显示的是 TK-2026…，同一个单两个号。
    var sysNo = (scene.ticket && /^TK-/.test(String(scene.ticket.no || '')))
      ? scene.ticket.no : ticketNoFor(sc);
    // 不返回 owner / reviewer：模型看到这两个字段就会在正文里写「责任人：…」，
    // 甚至自己编一个名字。工单上这栏由现场手填，工具就不该给出值。
    return {
      no: sysNo,
      scene: sc,
      level: a.level || rk.level,
      action: a.action || scene.ticket.action
    };
  }
  return { error:'未知工具 ' + name };
}

function buildMessages(c){
  var msgs = [{ role:'system', content: sysText() }, { role:'system', content: SCENE_CTX[S.scene] || '' }];
  c.msgs.slice(0, -1).forEach(function(x){
    // 只带当前场景的历史。切换到 B 之后还把 C 的对话塞进去，
    // 模型会拿着 C 的 8 人违规数据回答「B 场景什么等级」。
    if(x.scene && x.scene !== S.scene) return;
    if(x.role === 'user' || x.role === 'assistant') msgs.push({ role:x.role, content:x.content });
  });
  return msgs;
}

function withTimeout(signal, ms){
  var ctrl = new AbortController();
  var t = setTimeout(function(){ ctrl.abort(); }, ms);
  if(signal){
    if(signal.aborted) ctrl.abort();
    signal.addEventListener('abort', function(){ ctrl.abort(); });
  }
  return { signal: ctrl.signal, done: function(){ clearTimeout(t); } };
}

async function postDeepSeek(body, signal){
  var res = await fetch('https://api.deepseek.com/chat/completions', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + S.key },
    body: JSON.stringify(body),
    signal: signal
  });
  if(res.status === 401) throw new Error('API key 无效或已失效');
  if(res.status === 402) throw new Error('API 余额不足');
  if(!res.ok){
    var t = await res.text().catch(function(){ return ''; });
    throw new Error('上游 ' + res.status + (t ? ' · ' + t.slice(0,80) : ''));
  }
  return res;
}

/* 一轮非流式调用（带工具），拿 tool_calls 或最终文本 */
async function toolRound(messages, signal){
  var res = await postDeepSeek({
    model:'deepseek-chat', messages: messages, temperature:0.3,
    stream:false, tools: TOOLS, tool_choice:'auto'
  }, signal);
  var j = await res.json();
  return (j.choices && j.choices[0] && j.choices[0].message) || null;
}

/* 最后一轮：流式输出 */
async function streamFinal(messages, signal, onDelta){
  var res = await postDeepSeek({ model:'deepseek-chat', messages: messages, temperature:0.3, stream:true }, signal);
  var reader = res.body.getReader();
  var dec = new TextDecoder();
  var buf = '';
  while(true){
    var r = await reader.read();
    if(r.done) break;
    buf += dec.decode(r.value, { stream:true });
    var parts = buf.split('\n\n');
    buf = parts.pop();
    for(var i=0;i<parts.length;i++){
      var block = parts[i].trim();
      if(!block) continue;
      var lines = block.split('\n');
      for(var j=0;j<lines.length;j++){
        var ln = lines[j];
        if(ln.indexOf('data:') !== 0) continue;
        var payload = ln.slice(5).trim();
        if(payload === '[DONE]') return;
        try{
          var o = JSON.parse(payload);
          var d = o.choices && o.choices[0] && o.choices[0].delta;
          if(d && d.content) onDelta(d.content);
        }catch(e){}
      }
    }
  }
}

/* Agent 主循环：模型调工具 → 本地执行 → 结果回灌 → 直到它开口说话 */
async function agentRun(c, signal, onDelta, onTrace){
  var messages = buildMessages(c);
  for(var round = 0; round < 3; round++){
    var msg = await toolRound(messages, signal);
    if(!msg) throw new Error('空响应');
    if(msg.tool_calls && msg.tool_calls.length){
      messages.push({ role:'assistant', content: msg.content || '', tool_calls: msg.tool_calls });
      for(var i=0;i<msg.tool_calls.length;i++){
        var tc = msg.tool_calls[i];
        var args = {};
        try{ args = JSON.parse(tc.function.arguments || '{}'); }catch(e){}
        var out;
        try{ out = runTool(tc.function.name, args); }
        catch(e){ out = { error:String(e && e.message || e) }; }
        if(onTrace) onTrace({ name: tc.function.name, args: args, out: out });
        messages.push({ role:'tool', tool_call_id: tc.id, content: JSON.stringify(out) });
      }
      continue;   // 让模型拿着工具结果继续
    }
    if(msg.content){ onDelta(msg.content); return; }
    break;
  }
  // 兜底：还没说完就强制收尾
  messages.push({ role:'user', content:'请基于上面的工具结果，直接给出最终结论（用中文，不要再调用工具）。' });
  await streamFinal(messages, signal, onDelta);
}

/* ---------------- UI 控制 ---------------- */
function setBusy(b){
  $('#btnSend').style.display = b ? 'none' : 'grid';
  $('#btnStop').classList.toggle('on', b);
  $('#input').disabled = false;
}
function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = Math.min(180, el.scrollHeight) + 'px';
}
function setScene(k){
  S.scene = k;
  renderPanel(); save();
  if(!convo(S.active) || !convo(S.active).msgs.length) renderConvo();
  if(MODEL.ready) refreshModelScene(k, true);
}
function switchConvo(id){
  S.active = id; save(); renderList(); renderConvo(); toBottom(false);
}
function newConvo(){
  var c = { id: uid(), title:'新对话', ts: Date.now(), msgs: [] };
  S.convos.unshift(c); S.active = c.id;
  if(S.convos.length > 30) S.convos.length = 30;   // 只留最近 30 个会话
  save(); renderList(); renderConvo();
  $('#input').focus();
}
function delConvo(id){
  var i = S.convos.findIndex(function(c){ return c.id === id; });
  if(i < 0) return;
  S.convos.splice(i, 1);
  if(S.active === id) S.active = S.convos[0] ? S.convos[0].id : null;
  save(); renderList(); renderConvo();
}

document.addEventListener('click', function(e){
  var ask = e.target.closest('[data-ask]');
  if(ask){
    var kind = ask.getAttribute('data-ask');
    var qs = {
      risk: '这个场景现在什么风险等级？L 和 S 分别怎么来的？',
      ticket: '把没戴安全帽的这个人开一张整改工单，写清整改要求和时限。',
      law: '这条违规触犯了哪条法规？把原文念一下。'

    autoGrow($('#input'));
    send();
    return;
  }
  var regen = e.target.closest('[data-regen]');

    var c = convo(S.active);
    if(!c || S.busy) return;
    while(c.msgs.length && c.msgs[c.msgs.length-1].role === 'assistant') c.msgs.pop();
    var lastUser = c.msgs[c.msgs.length-1];
    renderConvo(); save();

  }
  var copy = e.target.closest('[data-copy]');
