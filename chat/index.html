  var det = e.target.closest('[data-detail]');
  if(det){
    // 用这条消息自己的卡片渲染右栏。原来只 scrollTop(0)，
    // 右栏仍是「当前场景」的实测，和这条消息对不上，点了像没反应。
    var idx = det.getAttribute('data-detail');
    var msg = (idx !== '' && idx !== null) ? (convo(S.active) || {}).msgs[+idx] : null;
    var card = msg ? findCard(msg.content) : null;
    if(card){
      card = normalizeCard(card, msg.scene || S.scene, +idx);
      renderPanelCard(card, msg.scene || S.scene);
      if(window.innerWidth <= 1180){
        $('#panel').classList.add('on'); $('#mask').classList.add('on');
      }else{
        $('#pbody').scrollTop = 0;
        toast('右栏已切到这条研判');
      }
    }else{
      if(window.innerWidth <= 1180){
        $('#panel').classList.add('on'); $('#mask').classList.add('on');
      }else{
        $('#pbody').scrollTop = 0;
      }
      toast('这条消息里没有研判卡片');
    }
    return;
  }
});

/* ---------------- 导出标准工单（.docx，纯前端生成） ----------------
   一个 .docx 就是一个 zip；这里用「存储不压缩」的 zip，浏览器里百来行就能写出来，
   不引任何第三方库、不走 CDN、不依赖后端，离线也能导出。
   版式按常规《安全隐患整改通知单》：标题 → 基本信息表 → 违规明细 →
   整改要求 → 法规依据 → 签署栏。 */
var CRC_T = (function(){
  var t = new Int32Array(256);
  for(var n = 0; n < 256; n++){
    var c = n;
    for(var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();
function crc32(u8){
  var c = -1;
  for(var i = 0; i < u8.length; i++) c = (c >>> 8) ^ CRC_T[(c ^ u8[i]) & 0xFF];
  return (c ^ -1) >>> 0;
}
function zipStore(entries){
  var enc = new TextEncoder(), parts = [], central = [], offset = 0;
  entries.forEach(function(e){
    var name = enc.encode(e.name);
    var data = e.text != null ? enc.encode(e.text) : e.data;
    var crc = crc32(data), size = data.length;
    var lh = new Uint8Array(30 + name.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true); lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true); lv.setUint16(12, 0x21, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, size, true); lv.setUint32(22, size, true);
    lv.setUint16(26, name.length, true); lv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);
    var ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true);
    cv.setUint16(14, 0x21, true); cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true); cv.setUint32(24, size, true);
    cv.setUint16(28, name.length, true); cv.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);
    offset += lh.length + size;
  });
  var cdSize = central.reduce(function(a, b){ return a + b.length; }, 0);
  var end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, entries.length, true); ev.setUint16(10, entries.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [end]),
    { type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

function xesc(v){
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function p2(n){ n = String(n); return n.length < 2 ? '0' + n : n; }

function wRpr(o){
  o = o || {};
  return '<w:rPr><w:rFonts w:ascii="Times New Roman" w:eastAsia="宋体" w:hAnsi="Times New Roman"/>'
    + (o.b ? '<w:b/>' : '')
    + (o.color ? '<w:color w:val="' + o.color + '"/>' : '')
    + '<w:sz w:val="' + (o.sz || 21) + '"/><w:szCs w:val="' + (o.sz || 21) + '"/>'
    + (o.u ? '<w:u w:val="single"/>' : '') + '</w:rPr>';
}
function wP(text, o){
  o = o || {};
  // pPr 子元素顺序按 OOXML 规范：spacing → ind → jc（顺序错了 Word 会报文档损坏）
  var pPr = '<w:pPr>'
    + '<w:spacing w:before="' + (o.before || 0) + '" w:after="' + (o.after || 0)
    + '" w:line="' + (o.line || 300) + '" w:lineRule="auto"/>'
    + (o.ind ? '<w:ind w:firstLine="' + o.ind + '"/>' : '')
    + (o.align ? '<w:jc w:val="' + o.align + '"/>' : '')
    + '</w:pPr>';
  return '<w:p>' + pPr + '<w:r>' + wRpr(o) + '<w:t xml:space="preserve">' + xesc(text) + '</w:t></w:r></w:p>';
}
function wTc(text, o){
  o = o || {};
  return '<w:tc><w:tcPr><w:tcW w:w="' + (o.w || 2000) + '" w:type="dxa"/>'
    + (o.span ? '<w:gridSpan w:val="' + o.span + '"/>' : '')
    + (o.fill ? '<w:shd w:val="clear" w:color="auto" w:fill="' + o.fill + '"/>' : '')
    + '<w:vAlign w:val="center"/></w:tcPr>'
    + wP(text, { sz:o.sz || 19, b:o.b, align:o.align || 'left', line:260 })
    + '</w:tc>';
}
function wTbl(rows, widths){
  var grid = widths.map(function(w){ return '<w:gridCol w:w="' + w + '"/>'; }).join('');
  var total = widths.reduce(function(a, b){ return a + b; }, 0);
  var bd = '<w:tblBorders>'
    + ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(function(k){
        return '<w:' + k + ' w:val="single" w:sz="4" w:space="0" w:color="808080"/>';
      }).join('') + '</w:tblBorders>';
  return '<w:tbl><w:tblPr><w:tblW w:w="' + total + '" w:type="dxa"/><w:jc w:val="center"/>' + bd
    + '<w:tblCellMar><w:top w:w="50" w:type="dxa"/><w:left w:w="100" w:type="dxa"/>'
    + '<w:bottom w:w="50" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar>'
    + '</w:tblPr><w:tblGrid>' + grid + '</w:tblGrid>' + rows.join('') + '</w:tbl>';
}

function buildTicketXml(d){
  var W = [1500, 3300, 1500, 3300];
  var info = [];
  info.push('<w:tr>' + wTc('受检区域', {w:W[0], b:1, fill:'F2F2F2', align:'center'})
    + wTc(d.region, {w:W[1]}) + wTc('作业类型', {w:W[2], b:1, fill:'F2F2F2', align:'center'})
    + wTc(d.work, {w:W[3]}) + '</w:tr>');
  info.push('<w:tr>' + wTc('风险等级', {w:W[0], b:1, fill:'F2F2F2', align:'center'})
    + wTc(d.grade, {w:W[1]}) + wTc('风险值', {w:W[2], b:1, fill:'F2F2F2', align:'center'})
    + wTc(d.rvalue, {w:W[3]}) + '</w:tr>');
  info.push('<w:tr>' + wTc('整改时限', {w:W[0], b:1, fill:'F2F2F2', align:'center'})
    + wTc(d.due, {w:W[1]}) + wTc('判定方式', {w:W[2], b:1, fill:'F2F2F2', align:'center'})
    + wTc(d.method, {w:W[3]}) + '</w:tr>');
  info.push('<w:tr>' + wTc('责任人', {w:W[0], b:1, fill:'F2F2F2', align:'center'})
    + wTc(d.owner, {w:W[1]}) + wTc('复查人', {w:W[2], b:1, fill:'F2F2F2', align:'center'})
    + wTc(d.reviewer, {w:W[3]}) + '</w:tr>');
  info.push('<w:tr>' + wTc('下发时间', {w:W[0], b:1, fill:'F2F2F2', align:'center'})
    + wTc(d.issued, {w:W[1]}) + wTc('工单编号', {w:W[2], b:1, fill:'F2F2F2', align:'center'})
    + wTc(d.no, {w:W[3]}) + '</w:tr>');

  var VW = [700, 1100, 1500, 6300];
  var rows = ['<w:tr>'
    + wTc('序号', {w:VW[0], b:1, fill:'F2F2F2', align:'center'})
    + wTc('人员', {w:VW[1], b:1, fill:'F2F2F2', align:'center'})
    + wTc('判定结论', {w:VW[2], b:1, fill:'F2F2F2', align:'center'})
    + wTc('判定依据', {w:VW[3], b:1, fill:'F2F2F2', align:'center'}) + '</w:tr>'];
  d.verdicts.forEach(function(v, i){
    rows.push('<w:tr>' + wTc(String(i + 1), {w:VW[0], align:'center'})
      + wTc(v.p, {w:VW[1], align:'center'})
      + wTc(v.state, {w:VW[2], align:'center'})
      + wTc(v.note || '—', {w:VW[3], sz:18}) + '</w:tr>');
  });

  var SW = [3200, 3200, 3200];
  var sign = '<w:tr>'
    + wTc('检查人（签字）', {w:SW[0], b:1, fill:'F2F2F2', align:'center'})
    + wTc('责任人（签字）', {w:SW[1], b:1, fill:'F2F2F2', align:'center'})
    + wTc('复查人（签字）', {w:SW[2], b:1, fill:'F2F2F2', align:'center'}) + '</w:tr>'
    + '<w:tr><w:trPr><w:trHeight w:val="900" w:hRule="atLeast"/></w:trPr>'
    + wTc('', {w:SW[0]}) + wTc('', {w:SW[1]}) + wTc('', {w:SW[2]}) + '</w:tr>'
    + '<w:tr>'
    + wTc('日期：      年    月    日', {w:SW[0], sz:18})
    + wTc('日期：      年    月    日', {w:SW[1], sz:18})
    + wTc('日期：      年    月    日', {w:SW[2], sz:18}) + '</w:tr>';

  var body = '';
  body += wP('安全隐患整改通知单', { sz:36, b:1, align:'center', after:60 });
  body += wP('编号：' + d.no + '　　紧急程度：' + d.urgency, { sz:19, align:'center', after:180 });
  body += wTbl(info, W);
  body += wP('', { sz:12, after:60 });

  body += wP('一、违规事实', { sz:22, b:1, before:120, after:80 });
  body += wP('本次共识别 ' + d.persons + ' 人，其中未佩戴 ' + d.bad + ' 人、待复核 '
    + d.warn + ' 人、无法判定 ' + d.mute + ' 人。明细如下：', { sz:20, ind:420, after:80 });
  body += wTbl(rows, VW);
  body += wP('', { sz:12, after:60 });

  body += wP('二、整改要求', { sz:22, b:1, before:120, after:80 });
  body += wP(d.action, { sz:21, ind:420, after:120 });
  body += wP('完成时限：' + d.due, { sz:21, ind:420, after:160 });

  body += wP('三、法规依据', { sz:22, b:1, before:120, after:80 });
  d.law.forEach(function(l){
    body += wP(l.code, { sz:21, b:1, ind:420, after:20 });
    body += wP('「' + l.text + '」', { sz:19, ind:420, after:80 });
  });

  body += wP('', { sz:12, after:60 });
  body += wP('四、签署', { sz:22, b:1, before:120, after:80 });
  body += wTbl([sign], SW);
  body += wP('', { sz:12, after:60 });
  body += wP('本通知单由安巡 Agent 依据 ' + d.model + ' 实测判定与《安巡风险分级标准 v1.2》自动生成；'
    + 'R = L × S，L 取历史违规次数与本次违规人数的较高档，S 按作业类型取值。', { sz:17, color:'666666', after:0 });

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    + '<w:body>' + body
    + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>'
    + '<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1414" w:header="851" w:footer="992" w:gutter="0"/>'
    + '<w:cols w:space="425"/><w:docGrid w:linePitch="312"/></w:sectPr>'
    + '</w:body></w:document>';
}

function exportTicket(){
  var s = SCENES[S.scene];
  var t = s.ticket || {};
  var rk = sceneRisk(S.scene) || { L:'-', S:'-', R:'-', level:'', deadline:'' };
  var u = urgencyOf(rk.R) || { code:'', name:'' };
  var no = (t.no) ? String(t.no) : ticketNoFor(S.scene);
  var now = new Date();
  var counts = { ok:0, warn:0, bad:0, mute:0 };
  (s.verdicts || []).forEach(function(v){ counts[v.tone] = (counts[v.tone] || 0) + 1; });

  var d = {
    no: no,
    region: '＿＿＿＿＿＿＿＿',   // 无法确定的就不填，留空手写
    work: '＿＿＿＿＿＿',   // 作业类型同样无法从画面确定，留空手填
    grade: (u.code ? u.code + ' 级 · ' + u.name + '（' : '') + (rk.level || '') + (u.code ? '）' : ''),
    rvalue: 'R = ' + rk.R + '（L=' + rk.L + ' × S=' + rk.S + '）',
    due: (t.due_at ? String(t.due_at).replace('T', ' ').slice(5, 16) + ' 前' : (rk.deadline || '—')),
    method: 'AI 视觉识别 + 规则引擎（' + modelName() + '）',
    owner: t.owner || '＿＿＿＿＿＿（签字）',
    reviewer: t.reviewer || '＿＿＿＿＿＿（签字）',
    issued: now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate())
      + ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes()),
    urgency: u.code ? (u.code + ' 级 · ' + u.name) : (rk.level || '—'),
    persons: (s.verdicts || []).length,
    bad: counts.bad || 0, warn: counts.warn || 0, mute: counts.mute || 0,
    action: cleanReq(t.action || '按现场实际情况整改'),
    checks: s.checks || [],
    law: s.law || [],
    verdicts: s.verdicts || [],
    model: modelName()
  };

  var files = [
    { name:'[Content_Types].xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
      + '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'
      + '</Types>' },
    { name:'_rels/.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
      + '</Relationships>' },
    { name:'word/_rels/document.xml.rels', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
      + '</Relationships>' },
    { name:'word/styles.xml', text:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      + '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
      + '<w:docDefaults><w:rPrDefault><w:rPr>'
      + '<w:rFonts w:ascii="Times New Roman" w:eastAsia="宋体" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>'
      + '<w:sz w:val="21"/><w:szCs w:val="21"/></w:rPr></w:rPrDefault>'
      + '<w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="300" w:lineRule="auto"/></w:pPr></w:pPrDefault>'
      + '</w:docDefaults>'
      + '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>'
      + '</w:styles>' },
    { name:'word/document.xml', text: buildTicketXml(d) }
  ];

  var blob = zipStore(files);
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = no + '.docx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  toast('工单已导出：' + no + '.docx');
}
$('#stream').addEventListener('scroll', function(){
  $('#jump').classList.toggle('on', !atBottom());
});
$('#jump').onclick = function(){ toBottom(true); };
function paintStatus(){
  var st = $('#status'), txt = $('#statusText');
  st.classList.remove('demo','live');
  if(S.cloudState === 'ready'){
    st.classList.add('live');
    txt.textContent = '已连接 · 云端' + (MODEL.ready && MODEL.info && MODEL.info.name ? ' · ' + MODEL.info.name : '');
  }else if(S.cloudState === 'failed'){
    st.classList.add('demo');
    txt.textContent = '云端未连接 · 点此重试';
  }else{
    txt.textContent = '正在连接云端…';
  }
  st.title = (S.cloudState === 'failed') ? '点击重新连接云端模型' : '云端模型（免密钥）';
}
$('#btnUpload').onclick = function(){
  if(!MODEL.ready){ toast('模型服务没起来：先运行 python serve.py'); return; }
  pickImage();
};

/* 状态条点击 = 重连云端（连不上时唯一能做的事） */
async function reconnectCloud(){
  if(S.busy) return;
  if(typeof CLOUD !== 'undefined' && CLOUD.ready && S.cloudState === 'ready'){
    toast('云端模型已连接');
    return;
  }
  S.cloudState = 'connecting';
  paintStatus();
  var ok = false;
  try{ ok = await initCloud(); }catch(e){ ok = false; }
  if(ok){
    S.transport = 'cloud'; S.mode = 'live'; S.model = CLOUD.modelName;
    S.cloudState = 'ready';
    toast('已连接云端模型');
  }else{
    S.cloudState = 'failed';
    toast('还是连不上，检查一下网络后刷新页面');
  }
  paintStatus();
}
$('#status').onclick = function(){ reconnectCloud(); };

$('#fab').onclick = function(){
  var p = $('#panel');
  p.classList.toggle('on');
  $('#mask').classList.toggle('on', p.classList.contains('on'));
};
$('#mask').onclick = function(){
  $('#panel').classList.remove('on');
  $('#aside').classList.remove('on');
  $('#mask').classList.remove('on');
};

/* ---------------- 启动 ---------------- */
async function boot(){
  var qs = new URLSearchParams(location.search);
  if(qs.get('static') === '1') document.body.classList.add('static');
  var qScene = (qs.get('scene') || '').toUpperCase();
  if(SCENES[qScene]) S.scene = qScene;

  // 「在线研判台」入口只在本地出现：线上站点本身就是在线版，再放一个没意义
  // 本地和 GitHub Pages 都显示；anxun-desk 那个域名本身就是在线版，不显示
  var host = location.hostname;
  var isLocalHost = /^(127\.0\.0\.1|localhost|0\.0\.0\.0|\[::1\])$/.test(host)
                 || location.protocol === 'file:';
  var isGhPages = /\.github\.io$/i.test(host);
  var ol = $('#onlineLink');
  if(ol && (isLocalHost || isGhPages)) ol.hidden = false;

  var restored = load();
  if(SCENES[qScene]) S.scene = qScene;
  renderPanel();
  renderList();
  renderConvo();
  autoGrow($('#input'));

  // 同源服务（serve.py）：有模型就把右侧面板切成实测，与对话走哪条路无关。
  try{
    var r = await fetch(apiUrl('/api/health'), { cache:'no-store' });
    if(r.ok){
      var j = await r.json();
      if(j && j.model_info && j.model_info.ready){
        MODEL.ready = true;
        MODEL.info = j.model_info;
        if(j.chat_scene_map) MODEL.map = j.chat_scene_map;
        paintStatus();
        var bu = $('#btnUpload');
        if(bu) bu.hidden = false;
        refreshModelScene(S.scene, true);
      }
    }
  }catch(e){ /* file:// 或 GitHub Pages 静态托管：保留示例数据 */ }

  // 对话只有云端一条路。连不上就显示「云端未连接 · 点此重试」，
  // 不能退回预置回答——「演示模式」四个字出现在演示现场，前面讲的全白搭。
  S.cloudState = 'connecting';
  paintStatus();
  var cloudOk = false;
  try{ cloudOk = await initCloud(); }catch(e){ cloudOk = false; }
  if(cloudOk){
    S.transport = 'cloud';
    S.mode = 'live';
    S.model = CLOUD.modelName;
    S.cloudState = 'ready';
  }else{
    S.cloudState = 'failed';
  }
  paintStatus();

  if(!restored){
    newConvo();
  }

  var q0 = qs.get('q');
  if(q0){
    $('#input').value = q0;
    autoGrow($('#input'));
    setTimeout(function(){ send(); }, 60);
  }
}

boot();
})();
